<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel-2 NDVI Web Map Viewer | xboa</title>
  
  <!-- Modern Typography (Inter Font) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.75);
      --border-glass: rgba(255, 255, 255, 0.12);
      --accent-color: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a;
      color: var(--text-main);
      overflow: hidden;
    }

    /* Map Viewport */
    #map {
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Floating Glassmorphism Dashboard Panel */
    .control-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      width: 360px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      color: var(--accent-color);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .header-badge .pulse {
      width: 8px;
      height: 8px;
      background-color: var(--accent-color);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-color);
      animation: pulse-glow 2s infinite;
    }

    @keyframes pulse-glow {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .control-group {
      margin-bottom: 18px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: #e2e8f0;
    }

    .control-group label span.val {
      font-family: monospace;
      color: var(--accent-color);
      font-size: 0.85rem;
    }

    /* Range Input Slider Styling */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #334155;
      outline: none;
      transition: background 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      background: var(--accent-hover);
    }

    /* Select Inputs & Text Inputs */
    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    /* Toggle Switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 8px;
      border: 1px solid var(--border-glass);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-color);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* NDVI Legend Card */
    .legend-card {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-glass);
    }

    .legend-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .legend-bar {
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(to right, #a50026, #d73027, #f46d43, #fdae61, #fee08b, #d9ef8b, #a6d96a, #66bd63, #1a9850, #006837);
      margin-bottom: 6px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Footer Info Pill */
    .info-footer {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 30px;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    .info-footer span strong {
      color: #ffffff;
    }

    /* Leaflet Control Customization */
    .leaflet-control-zoom a {
      background: var(--bg-glass) !important;
      color: white !important;
      border-color: var(--border-glass) !important;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Control Panel Dashboard -->
  <div class="control-panel">
    <div class="header-badge">
      <span class="pulse"></span>
      <span>XYZ Raster Overlay</span>
    </div>
    <h1>NDVI Web Map</h1>
    <p class="subtitle">Sentinel-2 Normalized Difference Vegetation Index (EPSG:3857 Tiles)</p>

    <!-- Layer Toggle -->
    <div class="control-group">
      <div class="toggle-row">
        <span style="font-size: 0.85rem; font-weight: 500;">Show NDVI Overlay</span>
        <label class="switch">
          <input type="checkbox" id="layerToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- AOI Polygon Clipping Toggle -->
    <div class="control-group">
      <div class="toggle-row">
        <span style="font-size: 0.85rem; font-weight: 500;">Clip Raster to AOI</span>
        <label class="switch">
          <input type="checkbox" id="clipToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- AOI Boundary Line Toggle -->
    <div class="control-group">
      <div class="toggle-row">
        <span style="font-size: 0.85rem; font-weight: 500;">Show AOI Boundary</span>
        <label class="switch">
          <input type="checkbox" id="aoiToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Layer Opacity -->
    <div class="control-group">
      <label for="opacitySlider">
        <span>Overlay Opacity</span>
        <span class="val" id="opacityVal">85%</span>
      </label>
      <input type="range" id="opacitySlider" min="0" max="100" value="85">
    </div>

    <!-- Basemap Selector -->
    <div class="control-group">
      <label for="basemapSelect">Basemap Style</label>
      <select id="basemapSelect">
        <option value="dark">CartoDB Dark Matter (Recommended)</option>
        <option value="satellite">Esri World Imagery (Satellite)</option>
        <option value="osm">OpenStreetMap Standard</option>
      </select>
    </div>

    <!-- Tile Source URL Template -->
    <div class="control-group">
      <label for="tileUrlInput">Tile Source Template</label>
      <input type="text" id="tileUrlInput" value="/tiles/{z}/{x}/{y}.png">
    </div>

    <!-- Legend Card -->
    <div class="legend-card">
      <div class="legend-title">NDVI Index Palette</div>
      <div class="legend-bar"></div>
      <div class="legend-labels">
        <span>-0.2 (Water/Bare)</span>
        <span>0.3 (Sparse)</span>
        <span>+0.8 (Dense Veg)</span>
      </div>
    </div>
  </div>

  <!-- Status Footer -->
  <div class="info-footer">
    <span>Zoom: <strong id="zoomDisplay">--</strong></span>
    <span>Lat/Lon: <strong id="coordsDisplay">--</strong></span>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script>
    // Tile bounds helper: converts (x, y, z) tile indices to [lat, lon]
    function tile2lon(x, z) {
      return (x / Math.pow(2, z)) * 360 - 180;
    }
    function tile2lat(y, z) {
      const n = Math.PI - (2 * Math.PI * y) / Math.pow(2, z);
      return (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    }

    // Extent for downloaded AOI (Zoom 12: X[3015..3016], Y[1746]) in output/rasters/EPSG-3857
    const defaultBounds = L.latLngBounds(
      [tile2lat(1747, 12), tile2lon(3015, 12)], // South-West (lat_min, lon_min)
      [tile2lat(1746, 12), tile2lon(3017, 12)]  // North-East (lat_max, lon_max)
    );

    // 1. Basemap Tile Providers
    const basemaps = {
      dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
      }),
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
        maxZoom: 19
      }),
      osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
      })
    };

    // 2. Initialize Leaflet Map (centered generally until /info bounds load)
    let currentBounds = null;
    const map = L.map('map', {
      layers: [basemaps.dark],
      center: [10.0, 76.3],
      zoom: 12,
      zoomControl: false
    });

    // Custom top-right zoom control
    L.control.zoom({ position: 'topright' }).addTo(map);

    // --------------------------------------------------------------------------
    // 3. Setup Custom Tile Pane & SVG ClipPath for AOI Clipping
    // --------------------------------------------------------------------------
    // Dedicated pane for NDVI tiles (z-index 350: above basemap 200, below vector overlays 400)
    map.createPane('ndviPane');
    const ndviPane = map.getPane('ndviPane');
    ndviPane.style.zIndex = 350;

    // SVG container for the vector clipPath
    const svgNS = "http://www.w3.org/2000/svg";
    const clipSvg = document.createElementNS(svgNS, "svg");
    clipSvg.setAttribute("id", "aoiClipSvg");
    clipSvg.setAttribute("style", "position: absolute; width: 0; height: 0; pointer-events: none;");

    const defs = document.createElementNS(svgNS, "defs");
    const clipPath = document.createElementNS(svgNS, "clipPath");
    clipPath.setAttribute("id", "aoiClip");
    clipPath.setAttribute("clipPathUnits", "userSpaceOnUse");

    const clipPolygon = document.createElementNS(svgNS, "polygon");
    clipPolygon.setAttribute("id", "aoiClipPoly");
    clipPolygon.setAttribute("points", "");

    clipPath.appendChild(clipPolygon);
    defs.appendChild(clipPath);
    clipSvg.appendChild(defs);
    map.getContainer().appendChild(clipSvg);

    // Apply SVG clipPath to the ndviPane
    let isClipActive = true;
    ndviPane.style.clipPath = 'url(#aoiClip)';
    ndviPane.style.webkitClipPath = 'url(#aoiClip)';

    // 4. Default Fallback AOI Polygon (scripts/geo/polygon.json)
    let aoiPolygon = {
      "type": "Polygon",
      "coordinates": [
        [
          [76.1173, 9.7962],
          [76.4173, 9.7962],
          [76.4173, 10.0662],
          [76.1173, 10.0662],
          [76.1173, 9.7962]
        ]
      ]
    };
    let aoiCoords = aoiPolygon.coordinates[0];

    // AOI Vector Layer for visual boundary display
    let aoiVectorLayer = L.geoJSON(aoiPolygon, {
      style: {
        color: '#10b981',
        weight: 2,
        opacity: 0.9,
        dashArray: '6, 6',
        fillColor: '#10b981',
        fillOpacity: 0.05
      }
    }).addTo(map);

    // Converts geographic coordinates [lon, lat] into layer pixel points on the tile pane
    function updateClipPath() {
      if (!clipPolygon || !aoiCoords) return;
      if (!isClipActive) {
        ndviPane.style.clipPath = 'none';
        ndviPane.style.webkitClipPath = 'none';
        return;
      }
      ndviPane.style.clipPath = 'url(#aoiClip)';
      ndviPane.style.webkitClipPath = 'url(#aoiClip)';

      const pointsStr = aoiCoords.map(coord => {
        // coord format: [lon, lat] -> Leaflet uses [lat, lon]
        const pt = map.latLngToLayerPoint([coord[1], coord[0]]);
        return `${pt.x.toFixed(1)},${pt.y.toFixed(1)}`;
      }).join(' ');

      clipPolygon.setAttribute('points', pointsStr);
    }

    // Recalculate SVG clip-path dynamically across all map transforms
    map.on('move', updateClipPath);
    map.on('zoom', updateClipPath);
    map.on('viewreset', updateClipPath);
    map.on('resize', updateClipPath);

    // Point-in-polygon helper for inspection clicks
    function isPointInAOI(lon, lat) {
      if (!aoiCoords || aoiCoords.length < 3) return true;
      let inside = false;
      for (let i = 0, j = aoiCoords.length - 1; i < aoiCoords.length; j = i++) {
        const xi = aoiCoords[i][0], yi = aoiCoords[i][1];
        const xj = aoiCoords[j][0], yj = aoiCoords[j][1];
        const intersect = ((yi > lat) !== (yj > lat)) &&
            (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // Determine initial tile URL path based on environment
    let initialTileUrl = '/tiles/{z}/{x}/{y}.png';
    if (window.location.protocol === 'file:') {
      initialTileUrl = 'http://127.0.0.1:8000/tiles/{z}/{x}/{y}.png';
    }
    document.getElementById('tileUrlInput').value = initialTileUrl;

    // Helper to create tile layer inside ndviPane
    function createNdviLayer(url) {
      const opts = {
        pane: 'ndviPane',
        minZoom: 0,
        maxZoom: 20,
        opacity: document.getElementById('opacitySlider').value / 100
      };
      if (currentBounds) {
        opts.bounds = currentBounds;
      }
      return L.tileLayer(url, opts);
    }

    // 5. Create Custom XYZ Tile Layer Overlay inside the clipped pane
    let ndviTileLayer = createNdviLayer(initialTileUrl).addTo(map);

    // 6. UI Interactivity Handlers
    const opacitySlider = document.getElementById('opacitySlider');
    const opacityVal = document.getElementById('opacityVal');
    const layerToggle = document.getElementById('layerToggle');
    const clipToggle = document.getElementById('clipToggle');
    const aoiToggle = document.getElementById('aoiToggle');
    const basemapSelect = document.getElementById('basemapSelect');
    const tileUrlInput = document.getElementById('tileUrlInput');
    const zoomDisplay = document.getElementById('zoomDisplay');
    const coordsDisplay = document.getElementById('coordsDisplay');

    // Opacity Control
    opacitySlider.addEventListener('input', (e) => {
      const opacity = e.target.value / 100;
      opacityVal.textContent = `${e.target.value}%`;
      ndviTileLayer.setOpacity(opacity);
    });

    // Layer Toggle Switch
    layerToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        ndviTileLayer.addTo(map);
      } else {
        map.removeLayer(ndviTileLayer);
      }
    });

    // AOI Clip Toggle Switch
    clipToggle.addEventListener('change', (e) => {
      isClipActive = e.target.checked;
      updateClipPath();
    });

    // AOI Boundary Vector Toggle Switch
    aoiToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        map.addLayer(aoiVectorLayer);
      } else {
        map.removeLayer(aoiVectorLayer);
      }
    });

    // Basemap Switcher
    basemapSelect.addEventListener('change', (e) => {
      const selected = e.target.value;
      Object.values(basemaps).forEach(layer => map.removeLayer(layer));
      basemaps[selected].addTo(map);
    });

    // Dynamic Tile Source URL Update
    tileUrlInput.addEventListener('change', (e) => {
      const newUrl = e.target.value;
      map.removeLayer(ndviTileLayer);
      ndviTileLayer = createNdviLayer(newUrl).addTo(map);
    });

    // Coordinate & Zoom Tracking
    map.on('move', () => {
      const center = map.getCenter();
      coordsDisplay.textContent = `${center.lat.toFixed(4)}, ${center.lng.toFixed(4)}`;
      zoomDisplay.textContent = map.getZoom();
    });

    // Initialize displays
    zoomDisplay.textContent = map.getZoom();
    const initialCenter = map.getCenter();
    coordsDisplay.textContent = `${initialCenter.lat.toFixed(4)}, ${initialCenter.lng.toFixed(4)}`;

    // 7. Dynamic Metadata Auto-Configuration from TiTiler /info & /aoi
    const infoEndpoint = window.location.protocol === 'file:' 
      ? 'http://127.0.0.1:8000/info' 
      : '/info';
    const aoiEndpoint = window.location.protocol === 'file:'
      ? 'http://127.0.0.1:8000/aoi'
      : '/aoi';

    // Fetch dynamic AOI polygon
    fetch(aoiEndpoint)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(data => {
        if (data && data.coordinates && data.coordinates[0]) {
          aoiPolygon = data;
          aoiCoords = data.coordinates[0];
          map.removeLayer(aoiVectorLayer);
          aoiVectorLayer = L.geoJSON(aoiPolygon, {
            style: {
              color: '#10b981',
              weight: 2,
              opacity: 0.9,
              dashArray: '6, 6',
              fillColor: '#10b981',
              fillOpacity: 0.05
            }
          });
          if (aoiToggle.checked) {
            aoiVectorLayer.addTo(map);
          }
          updateClipPath();
          map.fitBounds(aoiVectorLayer.getBounds(), { padding: [40, 40] });
        }
      })
      .catch(err => {
        console.warn('Using embedded fallback AOI polygon:', err);
        updateClipPath();
      });

    // Fetch /info metadata
    fetch(infoEndpoint)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(info => {
        if (info.bounds_wgs84 && Array.isArray(info.bounds_wgs84) && info.bounds_wgs84.length === 4) {
          const [minLon, minLat, maxLon, maxLat] = info.bounds_wgs84;
          currentBounds = L.latLngBounds([minLat, minLon], [maxLat, maxLon]);
          ndviTileLayer.options.bounds = currentBounds;
          ndviTileLayer.redraw();
        }
        if (info.native_zoom && info.s_comp_meters) {
          const subtitle = document.querySelector('p.subtitle');
          if (subtitle) {
            subtitle.innerHTML = `Dataset: <code>${info.dataset_id}</code> (${info.s_comp_meters}m) &bull; Native Z${info.native_zoom} &bull; ${info.total_rasters} rasters (${info.storage_type})`;
          }
        }
      })
      .catch(err => {
        console.warn('Could not auto-fetch /info metadata, using defaults:', err);
      });

    // 8. Interactive Point Inspection (Queries EPSG:4326 Computation Raster)
    const inspectionPopup = L.popup({ minWidth: 200, className: 'ndvi-inspect-popup' });

    map.on('click', async (e) => {
      const lat = e.latlng.lat;
      const lon = e.latlng.lng;

      // If clipping is active and click is outside AOI, inform user
      if (isClipActive && !isPointInAOI(lon, lat)) {
        inspectionPopup
          .setLatLng(e.latlng)
          .setContent(`
            <div style="font-family: 'Inter', sans-serif; padding: 6px; color: #0f172a;">
              <div style="font-size: 0.85rem; font-weight: 700; color: #f59e0b; margin-bottom: 4px;">Outside AOI Polygon</div>
              <div style="font-size: 0.75rem; color: #64748b; margin-bottom: 6px;">The raster overlay is clipped to the target AOI boundary.</div>
              <div style="font-size: 0.72rem; color: #94a3b8;">Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}</div>
            </div>
          `)
          .openOn(map);
        return;
      }

      inspectionPopup
        .setLatLng(e.latlng)
        .setContent(`
          <div style="font-family: 'Inter', sans-serif; padding: 4px; color: #0f172a;">
            <div style="font-size: 0.75rem; color: #64748b; font-weight: 600;">Sampling EPSG:4326...</div>
            <div style="font-size: 0.8rem; color: #334155; margin-top: 4px;">Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}</div>
          </div>
        `)
        .openOn(map);

      const basePointUrl = window.location.protocol === 'file:' 
        ? 'http://127.0.0.1:8000/point' 
        : '/point';

      try {
        const res = await fetch(`${basePointUrl}?lat=${lat}&lon=${lon}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (data.found && data.ndvi !== null) {
          let badgeColor = '#10b981';
          let vegLabel = 'Dense Vegetation';
          if (data.ndvi < 0.0) {
            badgeColor = '#3b82f6';
            vegLabel = 'Water / Non-vegetated';
          } else if (data.ndvi < 0.2) {
            badgeColor = '#f97316';
            vegLabel = 'Bare Soil / Sparse';
          } else if (data.ndvi < 0.5) {
            badgeColor = '#eab308';
            vegLabel = 'Moderate Vegetation';
          }

          inspectionPopup.setContent(`
            <div style="font-family: 'Inter', sans-serif; padding: 6px; color: #0f172a; min-width: 190px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <span style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b;">EPSG:4326 Sample</span>
                <span style="background: ${badgeColor}20; color: ${badgeColor}; border: 1px solid ${badgeColor}50; border-radius: 12px; font-size: 0.65rem; font-weight: 700; padding: 2px 6px;">RAW</span>
              </div>
              <div style="font-size: 1.45rem; font-weight: 800; color: ${badgeColor}; line-height: 1.1; margin-bottom: 2px;">
                ${data.ndvi.toFixed(4)}
              </div>
              <div style="font-size: 0.8rem; font-weight: 600; color: #334155; margin-bottom: 8px;">
                ${vegLabel}
              </div>
              <div style="font-size: 0.72rem; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 6px; line-height: 1.5;">
                <div><strong>Coordinates:</strong> ${lat.toFixed(5)}, ${lon.toFixed(5)}</div>
                ${data.tile ? `<div><strong>Source Tile:</strong> <code>${data.tile}</code></div>` : ''}
              </div>
            </div>
          `);
        } else {
          inspectionPopup.setContent(`
            <div style="font-family: 'Inter', sans-serif; padding: 6px; color: #0f172a;">
              <div style="font-size: 0.85rem; font-weight: 700; color: #64748b; margin-bottom: 4px;">No Data</div>
              <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px;">Point outside covered raster extent or unmasked water.</div>
              <div style="font-size: 0.72rem; color: #64748b;">Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}</div>
            </div>
          `);
        }
      } catch (err) {
        inspectionPopup.setContent(`
          <div style="font-family: 'Inter', sans-serif; padding: 6px; color: #ef4444;">
            <div style="font-size: 0.85rem; font-weight: 700;">Query Failed</div>
            <div style="font-size: 0.75rem; color: #64748b;">${err.message}</div>
          </div>
        `);
      }
    });

  </script>
</body>
</html>
